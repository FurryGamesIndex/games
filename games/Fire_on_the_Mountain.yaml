name: Fire on the Mountain

brief-description: |
  Fire on the Mountain is a linear furry visual novel set at Campsite 7 in Crestfall National Park. Follow the staff and visitors as you explore this strange, neglected corner of the park; play minigames, use an interactive map, and gradually uncover the mystery surrounding the off-limits Blackthroat Peak. Choices do not alter the main story.

description: |
  Fire on the Mountain is a linear furry visual novel featuring minigames, an interactive map, and optional side conversations.

  The game itself is SFW, but it is intended for mature audiences and includes themes involving sex, alcohol, drug use, violence, child endangerment, depression, and suicidal ideation.

