name: 山火 / Fire on the Mountain

brief-description: |
  《山火》是一部线性 Furry 视觉小说，故事发生在克雷斯特福尔国家公园的 7 号营地。你将跟随这里的工作人员与访客，探索这个被护林员长期忽视的古怪角落；游戏包含小游戏、可交互地图和非关键选项，并逐步揭开禁止进入的黑喉峰背后的谜团。游戏中的选择不会改变主线剧情。

description: |
  《山火》是一部线性 Furry 视觉小说，包含小游戏、可交互地图和可选的支线对话。

  本作内容本身为 SFW，但面向成熟玩家，并涉及性、酒精、药物使用、暴力、儿童处于危险之中、抑郁以及自杀意念等成人主题。
